name: Verify estate data access
on:
  push:
    branches: [codex/estate-data-recovery]
    paths: [.github/workflows/estate-access.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compare page sizes and the live cancellation schema
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.parse,xml.etree.ElementTree as ET
          from collect_estate_transactions import existing_key,validate,URL
          key=existing_key();print('::add-mask::'+key,flush=True)
          for month,size in [('202605',1),('202501',1),('202501',100),('202501',1000)]:
              started=time.monotonic()
              query=urllib.parse.urlencode({'serviceKey':urllib.parse.unquote(key),'LAWD_CD':'11110','DEAL_YMD':month,'pageNo':1,'numOfRows':size})
              entry={'month':month,'page_size':size}
              try:
                  with urllib.request.urlopen(URL+'?'+query,timeout=15) as response:root=ET.fromstring(response.read())
                  items=root.findall('.//item');fields=sorted({node.tag for item in items for node in item})
                  cancellation=[f for f in fields if 'cancel' in f.lower() or 'cdeal' in f.lower()]
                  entry.update(total=validate(root),fields=fields,cancellation_nonempty={f:sum(bool((i.findtext(f) or '').strip()) for i in items) for f in cancellation})
              except Exception as error:entry['error']=type(error).__name__
              entry['seconds']=round(time.monotonic()-started,2);print(json.dumps(entry,ensure_ascii=False),flush=True)
          PY
