name: Verify estate data access
on:
  push:
    branches: [codex/estate-data-recovery]
    paths: [.github/workflows/estate-access.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the live cancellation schema without exposing credentials
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from collect_estate_transactions import existing_key,request,validate
          key=existing_key()
          print('::add-mask::'+key,flush=True)
          for code,month in [('11110','202501'),('11680','202101')]:
              root=request(key,code,month,1)
              items=root.findall('.//item')
              fields=sorted({node.tag for item in items for node in item})
              cancellation_fields=[f for f in fields if 'cancel' in f.lower() or 'cdeal' in f.lower()]
              print(json.dumps({'district':code,'month':month,'total':validate(root),'fields':fields,
                'cancellation_nonempty':{f:sum(bool((item.findtext(f) or '').strip()) for item in items) for f in cancellation_fields}},ensure_ascii=False),flush=True)
          PY
