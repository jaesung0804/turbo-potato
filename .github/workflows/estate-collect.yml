name: Collect complete apartment history
on:
  push:
    branches: [codex/estate-data-recovery]
    paths: [.github/workflows/estate-collect.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: estate-raw-data-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: data/molit_cache_v3
          key: estate-complete-v3-${{ github.run_id }}
          restore-keys: estate-complete-v3-
      - name: Restore authoritative raw state if present
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote origin refs/heads/estate-raw-state)" ]; then
            git fetch origin estate-raw-state
            git worktree add --detach .work/raw-state FETCH_HEAD
            python raw_estate_state.py restore --state-dir .work/raw-state
          else
            git worktree add --detach .work/raw-state HEAD
            git -C .work/raw-state switch --orphan estate-raw-state
          fi
      - name: Collect all approved general-API pages with checkpoints
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python collect_estate_transactions.py --start 202101 --end 202609 --refresh-months 0 --workers 2 --use-existing-config
      - name: Preserve completed checkpoints after success or failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/molit_cache_v3
          key: estate-complete-v3-${{ github.run_id }}
      - name: Pack complete raw state
        run: python raw_estate_state.py pack --state-dir .work/raw-state
      - name: Back up the verified raw state
        uses: actions/upload-artifact@v4
        with:
          name: complete-estate-state-${{ github.run_id }}
          path: |
            .work/raw-state/raw_manifest.json
            .work/raw-state/objects/
          retention-days: 90
      - name: Save raw state without changing the live site
        run: |
          set -euo pipefail
          git -C .work/raw-state config user.name github-actions[bot]
          git -C .work/raw-state config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C .work/raw-state add .gitattributes raw_manifest.json objects
          if ! git -C .work/raw-state diff --cached --quiet; then
            git -C .work/raw-state commit -m 'Save complete apartment API history with verified checkpoints'
            git -C .work/raw-state push origin HEAD:estate-raw-state
          fi
