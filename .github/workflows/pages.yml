name: Deploy dashboard to GitHub Pages
on:
  # Scheduled/full publication rebuilds data; manual UI-only publication reuses saved public data.
  # Code pushes must only validate; publish via the existing schedule or dispatch.
  workflow_run:
    workflows: ['Refresh immutable monthly potential research']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 20 * * *'
  workflow_dispatch:
    inputs:
      ui_only:
        description: Reuse checksum-verified public data and replace only the UI (no collection or training)
        type: boolean
        default: true
      refresh:
        description: Refresh the recent 3 months and one older month before publishing
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: estate-raw-data-update
  cancel-in-progress: false
env:
  RESEARCH_STORAGE: ${{ vars.RESEARCH_STORAGE || 'git' }}
  RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
  RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - name: Verify data and full-result behavior
        run: |
          python -m pytest -q tests
          node --check web/app.js
          node --check web/model.js
          node --check web/potential.js
          node tests/test_ui.cjs
          node tests/test_model_guide.cjs
          node tests/test_potential_ui.cjs
      - name: Validate manual publication scope
        if: github.event_name == 'workflow_dispatch' && inputs.ui_only == true && inputs.refresh == true
        run: |
          echo '::error::UI-only publication cannot request collection; choose one scope.'
          exit 1
      - name: Refresh only the UI from the saved public release
        if: github.event_name == 'workflow_dispatch' && inputs.ui_only == true
        run: |
          python refresh_saved_site.py --sha "$GITHUB_SHA"
          node tests/check_bundle.cjs .work/site
      - name: Restore checksum-verified complete raw state
        if: github.event_name != 'workflow_dispatch' || inputs.ui_only != true
        run: |
          set -euo pipefail
          if [ "$RESEARCH_STORAGE" = "backend" ]; then
            python backend_state.py pull --name estate-raw-state --state-dir .work/raw-state
          else
            git fetch origin estate-raw-state
            git worktree add --detach .work/raw-state FETCH_HEAD
          fi
          python raw_estate_state.py restore --state-dir .work/raw-state
      - name: Refresh recent transactions and rotate one historical month
        if: github.event_name == 'schedule' || (inputs.refresh == true && inputs.ui_only != true)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo '::error::MOLIT_API_KEY is required for the requested refresh.'
              exit 1
            fi
            echo '::warning::MOLIT_API_KEY is missing. Preserving the verified saved collection and its original observation dates.'
            echo 'Transaction refresh skipped: private MOLIT_API_KEY is missing; saved data dates remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            python collect_estate_transactions.py --refresh-months 3 --workers 2
          fi
      - name: Refresh dated public KB market context
        if: github.event_name != 'workflow_dispatch' || inputs.ui_only != true
        run: |
          python collect_kb_public_statistics.py --previous .work/raw-state/market_context.json
      - name: Persist complete raw state and dated market context
        if: github.event_name != 'workflow_dispatch' || inputs.ui_only != true
        run: |
          set -euo pipefail
          python raw_estate_state.py pack --state-dir .work/raw-state
          cp metadata/market_context.json .work/raw-state/market_context.json
          if [ "$RESEARCH_STORAGE" = "backend" ]; then
            python backend_state.py push --name estate-raw-state --state-dir .work/raw-state
            python backend_rows.py --csv data/capital_area_apt_trade_transactions.csv --dataset apt-trades --snapshot-name estate-raw-state --state-dir .work/raw-state
          else
            git -C .work/raw-state config user.name github-actions[bot]
            git -C .work/raw-state config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git -C .work/raw-state add -A
            if ! git -C .work/raw-state diff --cached --quiet; then
              git -C .work/raw-state commit -m 'Save verified incremental apartment transactions'
              git -C .work/raw-state push origin HEAD:estate-raw-state
            fi
          fi
      - name: Restore immutable monthly models
        if: github.event_name != 'workflow_dispatch' || inputs.ui_only != true
        run: |
          set -euo pipefail
          if [ "$RESEARCH_STORAGE" = "backend" ]; then
            python backend_state.py pull --name estate-model-state --state-dir .work/model-state
            python estate_model_state.py restore --state-dir .work/model-state
          else
            if [ -n "$(git ls-remote origin refs/heads/estate-model-state)" ]; then
              git fetch origin estate-model-state
              git worktree add --detach .work/model-state FETCH_HEAD
              python estate_model_state.py restore --state-dir .work/model-state
            else
              git worktree add --detach .work/model-state HEAD
              git -C .work/model-state switch --orphan estate-model-state
            fi
          fi
      - name: Restore the latest verified potential forecast
        if: github.event_name != 'workflow_dispatch' || inputs.ui_only != true
        run: |
          set -euo pipefail
          if [ "$RESEARCH_STORAGE" = "backend" ]; then
            python backend_state.py pull --name estate-potential-state --state-dir .work/potential-state
            python refresh_estate_potential.py restore --state-dir .work/potential-state
          else
            if git ls-remote --exit-code --heads origin estate-potential-state > /dev/null; then
              git fetch origin estate-potential-state
              git worktree add --detach .work/potential-state FETCH_HEAD
              python refresh_estate_potential.py restore --state-dir .work/potential-state
            else
              echo 'Using the committed baseline potential forecast; no state archive exists yet.'
            fi
          fi
      - name: Build full results with the frozen monthly model
        if: github.event_name != 'workflow_dispatch' || inputs.ui_only != true
        run: |
          python build_public_site.py
          node tests/check_bundle.cjs .work/site
      - name: Persist the model before public deployment
        if: github.event_name != 'workflow_dispatch' || inputs.ui_only != true
        run: |
          set -euo pipefail
          python estate_model_state.py pack --state-dir .work/model-state
          if [ "$RESEARCH_STORAGE" = "backend" ]; then
            python backend_state.py push --name estate-model-state --state-dir .work/model-state
          else
            git -C .work/model-state config user.name github-actions[bot]
            git -C .work/model-state config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git -C .work/model-state add .gitattributes model_manifest.json models
            if ! git -C .work/model-state diff --cached --quiet; then
              git -C .work/model-state commit -m 'Save immutable monthly estate reference model'
              git -C .work/model-state push origin HEAD:estate-model-state
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: (github.event_name != 'workflow_dispatch' || inputs.ui_only != true) && env.RESEARCH_STORAGE != 'backend'
        with:
          name: estate-model-and-validation-${{ github.run_id }}
          path: |
            models/
            .work/site/data/dashboard_manifest.json
            .work/site/data/model_validation.json
          retention-days: 90
      - name: Preserve compact backend release validation
        if: env.RESEARCH_STORAGE == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: estate-release-validation-${{ github.run_id }}
          path: |
            .work/site/data/dashboard_manifest.json
            .work/site/data/model_validation.json
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete static release
        uses: actions/upload-pages-artifact@v3
        with:
          path: .work/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public HTML, all periods and model metadata
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python verify_public_site.py --url "$PAGE_URL" --sha "$GITHUB_SHA"
          node tests/check_bundle.cjs .work/site "$PAGE_URL"
