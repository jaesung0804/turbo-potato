name: Check existing MOLIT API service access
on:
  workflow_dispatch:
  push:
    branches: [codex/estate-capital-history]
    paths: [.github/workflows/probe-capital-api.yml]
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check sale and rental services with the existing project key
        shell: python
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          import datetime, http.client, json, os, pathlib, re, ssl, sys
          import urllib.parse, xml.etree.ElementTree as ET
          sys.path.insert(0, os.getcwd())
          from collect_estate_transactions import existing_key
          key = existing_key()
          if not key:
              raise SystemExit('The project API key is unavailable; no request made')
          print('::add-mask::' + key, flush=True)
          results = []
          context = ssl.create_default_context()
          context.maximum_version = ssl.TLSVersion.TLSv1_2
          for kind, service, month in [('sale', 'RTMSDataSvcAptTrade', '200601'),
                                        ('rent', 'RTMSDataSvcAptRent', '201101')]:
              entry = {'kind': kind, 'service': service, 'region': '11110',
                       'contract_month': month, 'requested_rows': 1,
                       'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                       'attempts': 1, 'access_confirmed': False}
              connection = http.client.HTTPSConnection('apis.data.go.kr', timeout=45, context=context)
              try:
                  query = urllib.parse.urlencode({'serviceKey': urllib.parse.unquote(key),
                      'LAWD_CD': '11110', 'DEAL_YMD': month, 'pageNo': 1, 'numOfRows': 1})
                  path = '/1613000/' + service + '/get' + service
                  connection.request('GET', path + '?' + query, headers={'User-Agent': 'estate-data/3'})
                  response = connection.getresponse()
                  body = response.read(1024 * 1024)
                  entry['http_status'] = response.status
                  try:
                      root = ET.fromstring(body)
                      code = root.findtext('.//resultCode') or root.findtext('.//returnReasonCode')
                      entry['result_code'] = code if code and re.fullmatch(r'[0-9]{1,3}', code) else None
                      total = root.findtext('.//totalCount')
                      entry['total_count'] = int(total) if total and total.isdigit() else None
                      entry['returned_rows'] = len(root.findall('.//item'))
                      entry['access_confirmed'] = (response.status == 200 and code in {'0','00','000'}
                                                  and entry['total_count'] is not None)
                  except ET.ParseError:
                      entry['response_format'] = 'not_xml'
              except Exception as error:
                  entry['transport_error'] = type(error).__name__
              finally:
                  connection.close()
              results.append(entry)
              print(json.dumps(entry), flush=True)
          output = pathlib.Path('.work/api-access')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'access.json').write_text(json.dumps({'results': results}, indent=2) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: capital-api-access-${{ github.run_id }}
          path: .work/api-access/access.json
          retention-days: 90
