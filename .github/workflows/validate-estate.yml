name: Validate complete estate dashboard
on:
  pull_request:
  push:
    branches: [codex/estate-data-recovery, codex/estate-model-improvements]
    paths-ignore: [.github/workflows/estate-access.yml, .github/workflows/estate-collect.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: estate-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - name: Verify data, model isolation and full-result UI behavior
        run: |
          python -m pytest -q tests
          node --check web/app.js
          node --check web/model.js
          node --check web/potential.js
          node tests/test_ui.cjs
          node tests/test_model_guide.cjs
          node tests/test_potential_ui.cjs
      - name: Restore complete data if the collection has finished
        # PR/manual validation retains the complete candidate and ML checks.
        # A code push runs unit/UI checks without downloading production state.
        if: github.event_name != 'push'
        id: raw
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote origin refs/heads/estate-raw-state)" ]; then
            git fetch origin estate-raw-state
            git worktree add --detach .work/raw-state FETCH_HEAD
            python raw_estate_state.py restore --state-dir .work/raw-state
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build complete candidate and chronological validation
        if: steps.raw.outputs.ready == 'true'
        run: |
          python build_public_site.py
          node tests/check_bundle.cjs .work/site
      - uses: actions/upload-artifact@v4
        if: steps.raw.outputs.ready == 'true'
        with:
          name: verified-estate-candidate-${{ github.run_id }}
          path: |
            .work/site/
            models/
          retention-days: 14
