name: Collect focused rent research data
on:
  push:
    branches: [codex/estate-market-signals]
    paths: [collect_estate_rents.py, .github/workflows/research-market-data.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: estate-rent-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect published lease records for the three study districts
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python collect_estate_rents.py --start 202307 --end 202412
      - uses: actions/upload-artifact@v4
        with:
          name: estate-rent-research-${{ github.run_id }}
          path: .work/market-data/
          retention-days: 90
